<div
  class="diaria-form-shell"
  [class.form-container-embedded]="isEmbedded"
  [class.page-container]="!isEmbedded"
  [class.form-page]="!isEmbedded"
>
  <!-- Header (apenas na página standalone) -->
  @if (!isEmbedded) {
    <div class="page-header">
      <div class="header-content">
        <button class="btn-back" (click)="cancel()">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
            <path
              fill-rule="evenodd"
              d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z"
              clip-rule="evenodd"
            />
          </svg>
          Voltar
        </button>
        <h1>{{ pageTitle }}</h1>
      </div>
    </div>
  }

  <!-- Error Alert -->
  @if (error()) {
    <div class="alert alert-error">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
        <path
          fill-rule="evenodd"
          d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z"
          clip-rule="evenodd"
        />
      </svg>
      {{ error() }}
      <button class="alert-close" (click)="dismissError()">×</button>
    </div>
  }

  <!-- Form -->
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="form-card">
    @if (isEditMode()) {
      <div class="info-box">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
          <path
            fill-rule="evenodd"
            d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z"
            clip-rule="evenodd"
          />
        </svg>
        <p>
          Em modo de edição, funcionário e posto não podem ser alterados. Data, status e tipo podem
          ser modificados.
        </p>
      </div>
    }

    <!-- Funcionário -->
    <app-form-select
      id="funcionarioId"
      controlName="funcionarioId"
      dataCy="diaria-funcionario"
      label="Funcionário"
      [required]="true"
      [options]="funcionarioOptions()"
    ></app-form-select>

    <!-- Posto / Alocação -->
    <app-form-select
      id="alocacaoId"
      controlName="alocacaoId"
      dataCy="diaria-alocacao"
      label="Posto / Alocação"
      [required]="true"
      [options]="alocacaoOptions()"
    ></app-form-select>

    <!-- Data -->
    <app-form-input
      id="data"
      type="date"
      controlName="data"
      dataCy="diaria-data"
      label="Data"
      [required]="true"
    ></app-form-input>

    <!-- Status -->
    <app-form-select
      id="statusDiaria"
      controlName="statusDiaria"
      dataCy="diaria-status"
      label="Status"
      [required]="true"
      [options]="statusOptions"
    ></app-form-select>

    <!-- Tipo -->
    <app-form-select
      id="tipoDiaria"
      controlName="tipoDiaria"
      label="Tipo"
      [required]="true"
      [options]="tipoOptions"
      [helpText]="form.get('tipoDiaria')?.value === 'DOBRA_PROGRAMADA' ? '⚠️ Dobra programada: funcionário deve descansar após esta diária.' : ''"
    ></app-form-select>

    <!-- Actions -->
    <div class="form-actions">
      <button type="button" class="btn-secondary" (click)="cancel()" [disabled]="loading()">
        Cancelar
      </button>
      <button type="submit" class="btn-primary" [disabled]="loading() || form.invalid" data-testid="btn-save-diaria">
        @if (loading()) {
          <span class="spinner-small"></span>
          Salvando...
        } @else {
          <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
            <path
              d="M7.707 10.293a1 1 0 10-1.414 1.414l3 3a1 1 0 001.414 0l3-3a1 1 0 00-1.414-1.414L11 11.586V6h5a2 2 0 012 2v7a2 2 0 01-2 2H4a2 2 0 01-2-2V8a2 2 0 012-2h5v5.586l-1.293-1.293zM9 4a1 1 0 012 0v2H9V4z"
            />
          </svg>
          {{ isEditMode() ? 'Atualizar' : 'Criar' }} Diária
        }
      </button>
    </div>
  </form>
</div>
