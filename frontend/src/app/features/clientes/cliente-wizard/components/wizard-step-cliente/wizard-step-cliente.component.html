        <form [formGroup]="formCliente" class="form-grid">
          <div class="form-card">
            <h3 class="section-title">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                style="width: 1.1em; height: 1.1em; vertical-align: middle"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M3.75 21h16.5M4.5 3h15M5.25 3v18m13.5-18v18M9 6.75h1.5m-1.5 3h1.5m-1.5 3h1.5m3-6H15m-1.5 3H15m-1.5 3H15M9 21v-3.375c0-.621.504-1.125 1.125-1.125h3.75c.621 0 1.125.504 1.125 1.125V21"
                />
              </svg>
              Informações da Empresa
            </h3>
            <div class="form-row">
              <!-- Nome -->
              <app-form-input
                id="nome"
                controlName="nome"
                label="Nome do Cliente"
                type="text"
                placeholder="Ex: Cliente Horizonte Verde"
                [required]="true"
                dataCy="wizard-cliente-nome"
              ></app-form-input>

              <!-- CNPJ -->
              <app-form-input
                id="cnpj"
                controlName="cnpj"
                label="CNPJ"
                type="text"
                placeholder="00.000.000/0000-00"
                mask="00.000.000/0000-00"
                maxlength="18"
                [required]="true"
                dataCy="wizard-cliente-cnpj"
              ></app-form-input>
            </div>

            <h3 class="section-title">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                style="width: 1.1em; height: 1.1em; vertical-align: middle"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"
                />
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1 1 15 0Z"
                />
              </svg>
              Localização
            </h3>
            <div class="form-row">
              <div class="form-group">
                <label for="estado" class="form-label">
                  Estado (UF) <span class="required">*</span>
                </label>
                <select
                  id="estado"
                  formControlName="estado"
                  class="form-input"
                  [class.error]="hasError('estado')"
                  data-cy="wizard-cliente-estado"
                >
                  <option value="">Selecione o estado</option>
                  @for (uf of estados; track uf) {
                    <option [value]="uf">{{ uf }}</option>
                  }
                </select>
                @if (hasError('estado')) {
                  <span class="error-message">{{ getErrorMessage('estado') }}</span>
                }
              </div>

              <div class="form-group">
                <label for="cidade" class="form-label">
                  Cidade <span class="required">*</span>
                </label>
                <select
                  id="cidade"
                  formControlName="cidade"
                  class="form-input"
                  [class.error]="hasError('cidade')"
                  [disabled]="!formCliente.get('estado')?.value"
                  data-cy="wizard-cliente-cidade"
                >
                  <option value="">
                    {{
                      formCliente.get('estado')?.value
                        ? 'Selecione a cidade'
                        : 'Selecione um estado antes'
                    }}
                  </option>
                  @for (cidade of cidadesDisponiveis; track cidade) {
                    <option [value]="cidade">{{ cidade }}</option>
                  }
                </select>
                @if (hasError('cidade')) {
                  <span class="error-message">{{ getErrorMessage('cidade') }}</span>
                }
              </div>
            </div>

            <h3 class="section-title">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                style="width: 1.1em; height: 1.1em; vertical-align: middle"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M15 19.128a9.38 9.38 0 0 0 2.625.372 9.337 9.337 0 0 0 4.121-.952 4.125 4.125 0 0 0-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 0 1 8.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0 1 11.964-3.07M12 6.375a3.375 3.375 0 1 1-6.75 0 3.375 3.375 0 0 1 6.75 0Zm8.25 2.25a2.625 2.625 0 1 1-5.25 0 2.625 2.625 0 0 1 5.25 0Z"
                />
              </svg>
              Contatos Adicionais
            </h3>
            <!-- Email Gestor e Telefone Emergência -->
            <div class="form-row">
              <app-form-input
                id="emailGestor"
                controlName="emailGestor"
                label="E-mail do Gestor"
                type="email"
                placeholder="gestor@cliente.com.br"
              ></app-form-input>

              <app-form-input
                id="telefoneEmergencia"
                controlName="telefoneEmergencia"
                label="Telefone de Emergência"
                type="tel"
                placeholder="(11) 98765-4321"
                mask="(00) 0000-0000||(00) 00000-0000"
                maxlength="15"
                helpText="Digite apenas números"
              ></app-form-input>
            </div>

            <h3 class="section-title">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                style="width: 1.1em; height: 1.1em; vertical-align: middle"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"
                />
              </svg>
              Operação e Turnos
            </h3>
            <div class="form-row">
              <app-form-input
                id="quantidadeIdealPorTurno"
                controlName="quantidadeIdealPorTurno"
                label="Quantidade Ideal de Funcionários por Turno"
                type="number"
                min="1"
                max="10"
                [required]="true"
                dataCy="wizard-cliente-ideal"
                helpText="Equipe almejada por turno no cliente"
                customErrorMessage="Mínimo 1 e Máximo 10"
              ></app-form-input>

              <app-form-input
                id="horarioTrocaTurno"
                controlName="horarioTrocaTurno"
                label="Horário de Troca de Turno"
                type="time"
                [required]="true"
                dataCy="wizard-cliente-horario"
                helpText="Em que horário os turnos normalmente viram"
                customErrorMessage="Campo obrigatório"
              ></app-form-input>
            </div>
          </div>
        </form>
