<div class="page-container form-page">
  <div class="page-header">
    <div class="header-content">
      <button class="btn-back" routerLink="/postos">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
          <path
            fill-rule="evenodd"
            d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z"
            clip-rule="evenodd"
          />
        </svg>
        Voltar
      </button>
      <h1>{{ isEditMode() ? 'Editar Posto' : 'Novo Posto de Trabalho' }}</h1>
      <p class="subtitle">
        {{
          isEditMode()
            ? 'Atualize a localização do posto'
            : 'Preencha os dados do local de trabalho do cliente'
        }}
      </p>
    </div>
  </div>

  @if (error()) {
    <div class="alert alert-error">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
        <path
          fill-rule="evenodd"
          d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z"
          clip-rule="evenodd"
        />
      </svg>
      {{ error() }}
    </div>
  }

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="form-container">
    <div class="form-card">
      <h3 class="section-title">Vinculação</h3>
      <div class="form-row">
        <app-form-select
          id="clienteId"
          controlName="clienteId"
          label="Cliente"
          [required]="true"
          [options]="clienteOptions()"
        ></app-form-select>
        
        <app-form-select
          id="contratoId"
          controlName="contratoId"
          label="Contrato"
          [required]="true"
          [options]="contratoOptions()"
        ></app-form-select>
      </div>

      <h3 class="section-title">Dados do Posto</h3>
      <div class="form-row">
        <app-form-input
          id="nome"
          controlName="nome"
          label="Nome do Posto"
          placeholder="Ex: Portaria Principal"
          [required]="true"
        ></app-form-input>
        <div class="form-group"></div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <app-form-input
            id="cep"
            controlName="cep"
            label="CEP"
            placeholder="00000-000"
            maxlength="9"
            [required]="true"
            (blurEvent)="onCepBlur()"
            (input)="onCepInput()"
          ></app-form-input>
          @if (loadingCep()) {
            <span class="error-message">Consultando CEP...</span>
          }
        </div>
        <app-form-input
          id="cidade"
          controlName="cidade"
          label="Cidade"
          placeholder="Sua Cidade"
          [required]="true"
        ></app-form-input>
        <app-form-input
          id="estado"
          controlName="estado"
          label="Estado"
          placeholder="UF"
          maxlength="2"
          [required]="true"
          (blurEvent)="onEstadoBlur()"
        ></app-form-input>
      </div>

      <div class="form-row">
        <app-form-input
          id="endereco"
          controlName="endereco"
          label="Rua/Logradouro"
          placeholder="Rua..."
          [required]="true"
        ></app-form-input>
        <app-form-input
          id="numero"
          controlName="numero"
          label="Número"
          placeholder="Ex: 123"
          [required]="true"
        ></app-form-input>
      </div>

      <div class="form-row">
        <app-form-input
          id="complemento"
          controlName="complemento"
          label="Complemento (Opcional)"
          placeholder="Ex: Bloco A, Sala 5"
        ></app-form-input>
        <div class="form-group"></div>
      </div>

      <div class="form-footer">
        <p class="required-note"><span class="required">*</span> Campos obrigatórios</p>
        <div class="button-group">
          <button type="button" class="btn-secondary" routerLink="/postos" [disabled]="loading()">
            Cancelar
          </button>
          <button type="submit" class="btn-primary" [disabled]="loading()" data-testid="btn-save-posto">
            @if (loading()) {
              <span class="spinner-small"></span> Salvando...
            } @else {
              {{ isEditMode() ? 'Atualizar' : 'Cadastrar' }} Posto
            }
          </button>
        </div>
      </div>
    </div>
  </form>
</div>
