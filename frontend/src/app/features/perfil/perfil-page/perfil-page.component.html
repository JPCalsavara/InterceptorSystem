<div class="page-container form-page">
  <div class="page-header">
    <div class="header-content">
      <h1>
        <svg class="page-title-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
        </svg>
        Meu Perfil
      </h1>
      <p class="subtitle">Gerencie suas informações pessoais e preferências da conta</p>
    </div>
  </div>

  <div class="perfil-layout">
    <aside class="perfil-sidebar">
      <nav class="perfil-nav">
        <button class="perfil-nav-item active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
          </svg>
          Dados Pessoais
        </button>
        <button class="perfil-nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z" />
          </svg>
          Segurança e Senha
        </button>
        <button class="perfil-nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 0 0 5.454-1.31A8.967 8.967 0 0 1 18 9.75V9A6 6 0 0 0 6 9v.75a8.967 8.967 0 0 1-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 0 1-5.714 0m5.714 0a3 3 0 1 1-5.714 0M3.124 7.5A8.969 8.969 0 0 1 5.292 3m13.416 0a8.969 8.969 0 0 1 2.168 4.5" />
          </svg>
          Notificações
        </button>
      </nav>
    </aside>

    <main class="perfil-content card">
      <div class="perfil-section">
        <h2 class="section-title">Informações Básicas</h2>
        <p class="section-subtitle">Esses detalhes aparecerão no cabeçalho do sistema.</p>
        
        <div class="avatar-container">
          <div class="avatar-large">
            <span>{{ getInitials() }}</span>
          </div>
          <div class="avatar-actions">
            <button class="btn-secondary btn-sm" disabled>Alterar imagem</button>
            <span class="field-hint">Apenas JPG ou PNG. Máximo de 2 MB.</span>
          </div>
        </div>
        
        <form class="form-grid">
          <div class="form-group">
            <label class="form-label">Nome Completo</label>
            <input type="text" class="form-input" [value]="user()?.nome" disabled>
          </div>
          
          <div class="form-group">
            <label class="form-label">E-mail de Acesso</label>
            <input type="email" class="form-input" [value]="user()?.email" disabled>
          </div>
          
          <div class="form-group">
            <label class="form-label">Nome da Empresa</label>
            <input type="text" class="form-input" [value]="user()?.nomeEmpresa" disabled>
          </div>
        </form>

        <div class="form-actions" style="margin-top: 2rem;">
          <button class="btn-primary" disabled>Salvar Alterações</button>
        </div>
      </div>
    </main>
  </div>
</div>
