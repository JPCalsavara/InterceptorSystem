events {
    worker_connections 512;  # Reduzido para t3.micro (1 GiB RAM)
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Performance basics
    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 10M;

    # Compressão (reduz banda de saída)
    gzip on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        text/javascript;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # Rate limiting zona (proteção básica antes de chegar na API)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

    upstream dotnet_api {
        server api:8080;
        keepalive 4;  # Connection pool reduzido para Free Tier
    }

    server {
        listen 80;
        server_name _;  # Aceita qualquer Host header (CloudFront vai passar o seu domínio)

        # =========================================
        # Segurança: Headers padrão
        # =========================================
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # =========================================
        # API Backend — todas as rotas /api/*
        # =========================================
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass         http://dotnet_api/api/;
            proxy_redirect     off;

            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # WebSocket (necessário para SignalR futuro)
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection keep-alive;
            proxy_cache_bypass $http_upgrade;

            # Timeouts (conservadores para Free Tier)
            proxy_connect_timeout 10s;
            proxy_send_timeout    30s;
            proxy_read_timeout    60s;
        }

        # =========================================
        # Swagger (apenas em produção se quiser expor)
        # =========================================
        location /swagger {
            proxy_pass         http://dotnet_api/swagger;
            proxy_redirect     off;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # =========================================
        # WhatsApp Webhook (Meta exige HTTPS —
        # o CloudFront já termina TLS, aqui chega HTTP)
        # =========================================
        location /api/whatsapp/ {
            limit_req zone=api_limit burst=5 nodelay;

            proxy_pass         http://dotnet_api/api/whatsapp/;
            proxy_redirect     off;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;  # Meta exige HTTPS no header
        }

        # =========================================
        # Healthcheck endpoint (para CloudFront/ALB)
        # =========================================
        location /health {
            return 200 '{"status":"ok"}';
            add_header Content-Type application/json;
        }

        # =========================================
        # Bloqueia tudo que não é /api/* ou /swagger
        # =========================================
        location / {
            return 404 '{"error":"Not Found"}';
            add_header Content-Type application/json;
        }
    }
}
