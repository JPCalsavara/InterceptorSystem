services:
  # --- BANCO DE DADOS (Relacional/Core) ---
  db:
    image: postgres:15-alpine
    container_name: interceptor_db
    env_file:
      - ../../.env
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-admin}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-password123}"
      POSTGRES_DB: "${POSTGRES_DB:-interceptor_db}"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - interceptor-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-interceptor_db}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- API .NET (Backend) ---
  api:
    build:
      context: .
      dockerfile: InterceptorSystem.Api/Dockerfile
    container_name: interceptor_api
    env_file:
      - ../../.env
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=${POSTGRES_DB:-interceptor_db};Username=${POSTGRES_USER:-admin};Password=${POSTGRES_PASSWORD:-password123}
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - Jwt__Key=${JWT_KEY:-dev-only-jwt-key-interceptor-system-32chars-min!!}
      - Jwt__Issuer=${JWT_ISSUER:-InterceptorSystem}
      - Jwt__Audience=${JWT_AUDIENCE:-InterceptorSystem}
      - Jwt__ExpiresInHours=${JWT_EXPIRESIN:-24}
      # SMTP → MailHog (dev local — sem autenticação)
      # UPPERCASE para sobrescrever os valores do .env (Linux é case-sensitive)
      - SMTP__HOST=mailhog
      - SMTP__PORT=1025
      - SMTP__USERNAME=
      - SMTP__PASSWORD=
      - SMTP__FROMADDRESS=noreply@interceptor.local
      - SMTP__FROMNAME=Interceptor System (Dev)
      - SMTP__SECURESOCKET=None
      # Meta → placeholders para dev (não envia WhatsApp real)
      - Meta__PhoneNumberId=${META__PHONENUMBERID:-dev-phone-id}
      - Meta__AccessToken=${META__ACCESSTOKEN:-dev-access-token}
      - Meta__WebhookVerifyToken=${META__WEBHOOKVERIFYTOKEN:-dev-verify-token}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - interceptor-network
    # Não expomos a porta 8080 para o host. Só o Nginx fala com a API.
    expose:
      - "8080"

  # --- FRONTEND ANGULAR (SEPARADO) ---
  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      target: production # Usar 'development' no compose.override.yml
    container_name: interceptor_frontend
    ports:
      - "4201:80" # Frontend exposto diretamente na porta 4201
    networks:
      - interceptor-network

  # --- LOAD BALANCER / REVERSE PROXY (APENAS API) ---
  nginx:
    image: nginx:alpine
    container_name: interceptor_nginx
    ports:
      - "80:80" # API acessível via Nginx na porta 80
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    networks:
      - interceptor-network

volumes:
  postgres_data:

networks:
  interceptor-network:
    driver: bridge
